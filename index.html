<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="機電會勘">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>機電會勘紀錄</title>
<style>
:root{--pri:#1f3a5f;--pri2:#2d5a8e;--bg:#eef2f7;--card:#fff;--line:#d5dce6;--tx:#1b2430;--mut:#667385;--red:#d62828;--org:#e07a00;--grn:#1f8a4c;--yel:#ffde59}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header#top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
header#top .ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header#top button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;min-height:38px}
#net{font-size:12px;padding:2px 8px;border-radius:10px;background:#3b7d4f}
#net.off{background:#8a3b3b}
#saved{font-size:12px;opacity:.8;min-width:48px;text-align:right}
main{max-width:860px;margin:0 auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px;min-width:0}
label.f{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
input[type=text],input[type=tel],input[type=date],input[type=time],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;min-height:44px}
textarea{min-height:90px;resize:vertical}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
input:disabled,select:disabled,textarea:disabled{background:#f3f5f8;color:#333}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;min-height:46px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.red{background:#fff;border-color:var(--red);color:var(--red)}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.big{width:100%;font-size:18px;min-height:56px}
.btn:disabled{opacity:.45}
.muted{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#e6ebf2;color:#33475e;margin-right:4px;white-space:nowrap}
.tag.red{background:#fde2e2;color:#a31515}.tag.org{background:#fff0d9;color:#8a4b00}.tag.grn{background:#dcf3e5;color:#16663a}.tag.blu{background:#dde9fb;color:#1d4c8f}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px}
.list .it{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer}
.list .it .grow{flex:1;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;text-align:center;padding:8px 2px 6px;color:var(--mut);text-decoration:none;font-size:12px}
.tabs a span{display:block;font-size:20px;line-height:1.2}
.tabs a.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
.entry{border-left:5px solid var(--line)}
.entry.overdue{border-left-color:var(--red)}.entry.done{border-left-color:var(--grn)}.entry.prog{border-left-color:var(--pri2)}
.entry .hd{display:flex;gap:8px;align-items:flex-start}
.entry .no{font-weight:800;color:var(--pri);min-width:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#ccd}
.ph div{padding:6px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sigbox{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}
.sigbox .img{height:110px;border:1px dashed #aab;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fafbfd;margin:8px 0}
.sigbox .img img{max-height:104px;max-width:100%}
.lockbar{background:#fff7d6;border:1px solid #e9cf6b;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.warn{background:#fde2e2;border:1px solid #f0a5a5;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
table.tb{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px;vertical-align:top}
table.tb th{background:#eef2f7;white-space:nowrap}
.scrollx{overflow-x:auto}
/* modal */
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(10,15,25,.92)}
#modal.on{display:block}
.anno{position:absolute;inset:0;background:#0b0f16;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.atools,.abar{display:flex;gap:6px;padding:6px;overflow-x:auto;background:#141b26;flex:0 0 auto}
.atools button,.abar button{flex:0 0 auto;min-width:48px;min-height:46px;border-radius:10px;border:2px solid #3a4658;background:#222c3b;color:#fff;font-size:15px;padding:4px 10px}
.atools button.on,.abar button.on{border-color:var(--yel);background:#39465a}
.abar .clr{width:40px;min-width:40px;padding:0}
.abar .sep{flex:0 0 1px;background:#3a4658;margin:4px 2px}
.astage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.astage canvas{max-width:100%;max-height:100%;touch-action:none;background:#000}
.sheet{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 20px)}
.sheet .inner{max-width:860px;margin:0 auto}
.sigpad{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)}
.sigpad .sighd{text-align:center;margin-bottom:6px;display:flex;flex-direction:column}
.sigwrap{flex:1;position:relative;min-height:0;border:2px dashed #99a;border-radius:10px;background:#fff;overflow:hidden}
.sigwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
@media (max-height:500px){.sigpad .sighd{flex-direction:row;justify-content:center;gap:12px;font-size:14px}.sigpad .btn{min-height:42px;padding:6px 12px}}
.pinbox{position:relative;display:flex;gap:12px;justify-content:center;margin:18px 0 8px}
.pinbox span{width:56px;height:64px;border:2px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.pinbox span.cur{border-color:var(--pri);box-shadow:0 0 0 3px rgba(31,58,95,.15)}
.pinbox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;caret-color:transparent}
.pinbox.err span{border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:20px;z-index:99;font-size:14px;max-width:90%}
/* report */
#print{display:none}
.rpt{background:#fff;color:#000;font-family:"Noto Serif TC","PMingLiU","MingLiU",serif;font-size:13px;line-height:1.5;padding:14mm 12mm;max-width:210mm;margin:0 auto}
.rpt h1{text-align:center;font-size:20px;margin:0 0 4px}
.rpt .sub{text-align:center;font-size:13px;margin-bottom:10px}
.rpt h2{font-size:15px;margin:14px 0 6px;border-bottom:2px solid #000;padding-bottom:2px}
.rpt table{width:100%;border-collapse:collapse}
.rpt td,.rpt th{border:1px solid #000;padding:4px 6px;vertical-align:top}
.rpt th{background:#eee;font-weight:700;white-space:nowrap}
.rpt .kv th{width:16%;text-align:center}
.rpt ol{margin:0;padding-left:22px}
.rpt .red{color:#b00000;font-weight:700}
.rpt .phgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rpt .phc{border:1px solid #000;break-inside:avoid;page-break-inside:avoid}
.rpt .phc img{width:100%;display:block;max-height:80mm;object-fit:contain;background:#f4f4f4}
.rpt .phc .cap{padding:4px 6px;font-size:12px;border-top:1px solid #000}
.rpt .phc .cap b{display:inline-block;min-width:4.5em}
.rpt .sigs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #000;break-inside:avoid;page-break-inside:avoid}
.rpt .sigs>div{border:1px solid #000;padding:6px;min-height:34mm}
.rpt .sigs .role{font-weight:700}
.rpt .sigs img{height:20mm;max-width:100%;display:block;margin:2px auto}
.rpt table.pgwrap,.rpt table.pgwrap>*>tr>td{border:none;padding:0}
.rpt table.pgwrap>tbody>tr{break-inside:avoid;page-break-inside:avoid}
.rpt table.pgwrap>tbody>tr.brk{break-inside:auto;page-break-inside:auto}
.rpt table.pgwrap>thead>tr>td.sp,.rpt table.pgwrap>tfoot>tr>td.sp{height:0}
.rpt .phgrid{margin-bottom:8px}
.rpt table.trk th{font-size:12px;background:#fff}
.rpt table.trk td{font-size:12px;height:34px;vertical-align:middle}
table.tb.trk td{vertical-align:middle}
.donebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#dcf3e5;border:1px solid #9fd8b5;border-radius:10px;padding:10px;margin-top:8px}
.rpt .avoid{break-inside:avoid;page-break-inside:avoid}
.rpt .small{font-size:11px}
.rptwrap{overflow-x:auto;background:#888;padding:8px;border-radius:10px}
@media print{
  @page{size:A4;margin:0}
  .rpt table.pgwrap>thead>tr>td.sp,.rpt table.pgwrap>tfoot>tr>td.sp{height:10mm}
  .rpt{padding:0 12mm!important}
  html,body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  .rpt{padding:0;max-width:none}
}
</style>
</head>
<body>
<header id="top">
  <button id="back" hidden>‹ 返回</button>
  <div class="ttl" id="ttl">機電會勘紀錄</div>
  <span id="saved"></span>
  <span id="net">在線</span>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<div id="print"></div>

<script>
'use strict';
/* ========== 基本工具 ========== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const today = () => ymd(Date.now());
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtDT = t => t ? ymd(t).replace(/-/g, '/') + ' ' + hm(t) : '';
const WK = '日一二三四五六';
const wk = d => d ? WK[new Date(d + 'T00:00').getDay()] : '';
const roc = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+y - 1911}/${m}/${dd}`; };
const rocC = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+y - 1911}${m}${dd}`; };
const rocDT = t => t ? roc(ymd(t)) + ' ' + hm(t) : '';
const days = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
function nextThu(from = today()) { const d = new Date(from + 'T00:00'); const add = (4 - d.getDay() + 7) % 7; d.setDate(d.getDate() + add); return ymd(d); }
function toast(msg, ms = 2200) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

const STATUS = ['未開始', '進行中', '延宕', '待確認', '已完成', '取消'];
// 舊資料的「施工中」一律視為「進行中」
const normStatus = s => s === '施工中' ? '進行中' : s;
// 下拉選單：已定稿的舊紀錄若是舊名稱，仍照原樣顯示
const statusOpts = (cur, list = STATUS) => (list.includes(cur) || !cur ? list : [...list, cur]).map(x => `<option ${x === cur ? 'selected' : ''}>${x}</option>`).join('');
const CLOSED = ['已完成', '取消'];
const CATS = ['電氣', '弱電', '給排水', '消防', '建築配合', '材料進場', '其他'];
const LOCS = ['停車場B1', '停車場B2', '旅服中心1F', '旅服中心2F', '禮堂1F', '禮堂2F'];
function locSelect(attr, val, ro) {
  const list = [...S.settings.locations]; if (val && !list.includes(val)) list.push(val);
  return `<select ${attr} data-loc ${ro}><option value="">（請選擇）</option>${list.map(l => `<option ${l === val ? 'selected' : ''}>${esc(l)}</option>`).join('')}<option value="__add">＋ 新增位置…</option></select>`;
}
async function locPicked(el, prev) {
  if (el.value !== '__add') return el.value;
  const n = (prompt('輸入新的位置名稱（例：停車場B2 水塔機房）') || '').trim();
  if (!n) { el.value = prev || ''; return null; }
  if (!S.settings.locations.includes(n)) { S.settings.locations.push(n); await DB.put('kv', S.settings); }
  const o = document.createElement('option'); o.textContent = n; el.insertBefore(o, el.lastElementChild); el.value = n;
  return n;
}
function attendeesOf(i) {
  const a = i.signs.filter(s => s.img && s.name).map(s => `${s.role} ${s.name}`);
  return a.length ? a.join('、') : (i.paper ? (i.attendees || '') : '');
}

/* ========== IndexedDB ========== */
const DB = {
  d: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('mep-inspect', 2);
      r.onupgradeneeded = ev => {
        const d = r.result;
        if (ev.oldVersion < 1) {
          d.createObjectStore('kv', { keyPath: 'key' });
          d.createObjectStore('insp', { keyPath: 'id' });
          d.createObjectStore('items', { keyPath: 'id' });
          d.createObjectStore('photos', { keyPath: 'id' }).createIndex('insp', 'inspId');
        }
        if (ev.oldVersion < 2) d.createObjectStore('tombs', { keyPath: 'key' });
      };
      r.onsuccess = () => { this.d = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  run(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.d.transaction(store, mode); const q = fn(t.objectStore(store));
      t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(s, k) { return this.run(s, 'readonly', o => o.get(k)); },
  // 會同步的資料：內容有變才標記「待上傳」並更新時間
  async put(s, v) {
    if (SYNCED[s] || (s === 'kv' && v.key === 'settings')) {
      const old = await this.get(s, s === 'kv' ? v.key : v.id);
      if (!old || coreJSON(old) !== coreJSON(v) || v._annotDirty) { v._dirty = 1; v.updatedAt = Date.now(); }
      else { v._dirty = old._dirty; v.updatedAt = old.updatedAt; }
      if (old && v._seq == null) v._seq = old._seq;
      await this.putRaw(s, v); if (v._dirty) Sync.soon(); return;
    }
    return this.putRaw(s, v);
  },
  putRaw(s, v) { return this.run(s, 'readwrite', o => o.put(v)); },
  async del(s, k) {
    await this.delRaw(s, k);
    if (SYNCED[s]) { await this.putRaw('tombs', { key: s + ':' + k, store: s, id: k, t: Date.now() }); Sync.soon(); }
  },
  delRaw(s, k) { return this.run(s, 'readwrite', o => o.delete(k)); },
  all(s) { return this.run(s, 'readonly', o => o.getAll()); },
  photosOf(id) { return this.run('photos', 'readonly', o => o.index('insp').getAll(id)); },
};

const SYNCED = { insp: 1, items: 1, photos: 1 };
const LOCAL_KEYS = /^(_dirty|_seq|orig|annot|ver|_annotDirty|_lastStatus)$/;
const coreJSON = v => JSON.stringify(v, (k, x) => LOCAL_KEYS.test(k) || k === 'updatedAt' || k === 'origFileId' || k === 'annotFileId' ? undefined : x);
const strip = v => JSON.parse(JSON.stringify(v, (k, x) => LOCAL_KEYS.test(k) ? undefined : x));
const isDirty = v => !!v && (v._dirty || v._seq == null);
const SHARED_SETTINGS = ['project', 'gc', 'vendor', 'place', 'signers', 'locations'];

const DEFAULT_SETTINGS = {
  key: 'settings',
  project: '赤崁樓停車場二期新建工程',
  gc: '升富營造',
  vendor: '可曜企業有限公司',
  place: '赤崁樓停車場二期工地',
  signers: [
    { role: '營造廠 機電工程師', org: '升富營造', name: '' },
    { role: '營造廠 現場工程師', org: '升富營造', name: '' },
    { role: '營造廠 品管工程師', org: '升富營造', name: '' },
    { role: '可曜企業有限公司 工地管理人', org: '可曜企業有限公司', name: '' },
  ],
  locations: LOCS.slice(), stamp: true, gps: true, lastBackup: 0,
};
const S = { settings: null, cur: null, photos: [] };

/* ========== 圖片處理 ========== */
const MAXPX = 1600;
async function loadBitmap(blob) {
  if (window.createImageBitmap) { try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e) { } }
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(blob); });
}
function fit(w, h, m) { const k = Math.min(1, m / Math.max(w, h)); return { w: Math.round(w * k), h: Math.round(h * k) }; }
function drawShape(x, s, u) {
  x.save();
  x.strokeStyle = x.fillStyle = s.c; x.lineWidth = s.w * u * 1.6; x.lineCap = x.lineJoin = 'round';
  x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = u * 1.2;
  const a = s.p[0], b = s.p[s.p.length - 1];
  switch (s.t) {
    case 'rect': x.strokeRect(Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])); break;
    case 'circle': x.beginPath(); x.ellipse((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, Math.abs(b[0] - a[0]) / 2 || 1, Math.abs(b[1] - a[1]) / 2 || 1, 0, 0, Math.PI * 2); x.stroke(); break;
    case 'line': case 'arrow':
      x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke();
      if (s.t === 'arrow') {
        const g = Math.atan2(b[1] - a[1], b[0] - a[0]), L = s.w * u * 6;
        x.beginPath(); x.moveTo(b[0], b[1]);
        x.lineTo(b[0] - L * Math.cos(g - .45), b[1] - L * Math.sin(g - .45));
        x.lineTo(b[0] - L * Math.cos(g + .45), b[1] - L * Math.sin(g + .45));
        x.closePath(); x.fill();
      } break;
    case 'free': x.beginPath(); s.p.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke(); break;
    case 'text': {
      const fs = Math.round(s.w * u * 8);
      x.font = `bold ${fs}px system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif`; x.textBaseline = 'top'; x.shadowBlur = 0;

function entryCalc(e, asOf) {
  const postponedNow = !!(e.prevPromise && e.promise && e.promise > e.prevPromise);
  const postpones = (e.basePostpones || 0) + (postponedNow ? 1 : 0);
  const closed = CLOSED.includes(e.status);
  const overdue = !closed && e.promise && e.promise < asOf;
  const first = e.firstPromise || e.promise;
  const ref = e.status === '已完成' ? (e.doneDate || asOf) : asOf;
  const delay = first && e.status !== '取消' && ref > first ? days(first, ref) : 0;
  return { postponedNow, postpones, overdue, delay, first };
}
function itemCalc(it) {
  const closed = CLOSED.includes(it.status), ref = it.status === '已完成' ? (it.doneDate || today()) : today();
  const delay = it.firstPromise && it.status !== '取消' && ref > it.firstPromise ? days(it.firstPromise, ref) : 0;
  return { closed, overdue: !closed && it.latestPromise && it.latestPromise < today(), delay };

    basePostpones: it.postpones || 0, status: it.status || '未開始', note: '', doneDate: it.doneDate || '',

}
// 列管頁的直接更新帶進未定稿的會勘紀錄（只帶比本次紀錄編輯更新的部分）
async function refreshEntries(insp) {
  const all = await DB.all('insp');
  if (all.some(x => x.date > insp.date)) return false;   // 只更新最新一次會勘
  let changed = false;
  const items = await DB.all('items'), have = new Set(insp.entries.map(e => e.itemId));
  for (const e of insp.entries) {
    const it = items.find(x => x.id === e.itemId);
    if (!it || !it.lastUpdate || it.lastUpdate <= (e._editedAt || 0) || it.lastUpdate <= (e._fromItem || 0)) continue;
    e.prevPromise = it.prevPromise || it.latestPromise || e.prevPromise;
    e.promise = it.latestPromise || '';
    e.firstPromise = it.firstPromise || e.firstPromise;
    e.basePostpones = Math.max(0, (it.postpones || 0) - (e.promise && e.prevPromise && e.promise > e.prevPromise ? 1 : 0));
    e.status = it.status; e.doneDate = it.doneDate || '';
    e.note = [it.progress, it.remark].filter(Boolean).join('；') || e.note;
    e._fromItem = it.lastUpdate; changed = true;
  }
  for (const it of items) {
    if (have.has(it.id) || CLOSED.includes(it.status) || !(it.createdAt > insp.createdAt)) continue;
    insp.entries.push(entryFromItem(it)); changed = true;
  }
  return changed;
}
async function syncItems(insp) {
  for (const e of insp.entries) {
    const it = await DB.get('items', e.itemId); if (!it) continue;
    const c = entryCalc(e, insp.date);
    it.history = it.history || {};
    it.history[insp.id] = { date: insp.date, seq: insp.seq, status: e.status, promise: e.promise, note: e.note, postponed: c.postponedNow };
    const direct = it.lastUpdate && it.lastUpdate > (e._editedAt || 0);   // 列管頁有較新的直接更新
    if (!direct && (!it.lastInspDate || insp.date >= it.lastInspDate)) {
      Object.assign(it, {
        title: e.title, area: e.area, cat: e.cat, status: e.status, latestPromise: e.promise,
        firstPromise: e.firstPromise || e.promise || '', postpones: c.postpones, lastInspDate: insp.date,
        doneDate: e.status === '已完成' ? (e.doneDate || insp.date) : '',

      if (e._editedAt && e.prevPromise && e.promise !== e.prevPromise) it.prevPromise = e.prevPromise;

    await DB.put('items', it);

}

function pickPhotos(camera, itemId = '') {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  if (camera) inp.capture = 'environment'; else inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files]; if (!files.length) return;
    toast(`處理 ${files.length} 張照片中…`);
    const ent = S.cur.entries.find(e => e.itemId === itemId);
    let last = null;
    for (const f of files) {
      const p = {
        id: uid(), inspId: S.cur.id, orig: f, origName: f.name, origType: f.type, shapes: [],
        takenAt: camera ? Date.now() : (f.lastModified || Date.now()), createdAt: Date.now(),
        title: ent ? ent.title : '', desc: '', loc: ent ? ent.area : '', itemId, gps: null,
      };
      try { await renderPhoto(p); } catch (err) { alert('照片讀取失敗：' + f.name); continue; }
      await DB.put('photos', p); S.photos.push(p); last = p; getGPS(p);
    }
    addLog(`新增照片 ${files.length} 張`); await saveNow();

    else route();

}
function getGPS(p) {
  if (!S.settings.gps || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    p.gps = { lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6), acc: Math.round(pos.coords.accuracy) };
    await DB.put('photos', p);
  }, () => { }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 120000 });
}

/* --- 標註器 --- */
function annotate(p) {
  return new Promise(async resolve => {
    try { if (!p.orig) { toast('下載原始照片中…'); await ensureOrig(p); } } catch (e) { alert(e.message); return resolve(false); }
    const bmp = await loadBitmap(p.orig); const { w, h } = fit(bmp.width, bmp.height, MAXPX);
    const shapes = JSON.parse(JSON.stringify(p.shapes || []));
    const TOOLS = [['circle', '◯ 圈'], ['rect', '▢ 框'], ['arrow', '➜ 箭頭'], ['line', '╱ 線'], ['free', '✎ 手繪'], ['text', 'A 文字']];
    const COLORS = ['#ff1a1a', '#ffde00', '#00d26a', '#1e90ff', '#ffffff'];
    let tool = 'circle', color = COLORS[0], lw = 2, cur = null;
    const M = $('#modal'); M.classList.add('on');
    M.innerHTML = `<div class="anno">
      <div class="atools">${TOOLS.map(([t, l]) => `<button data-t="${t}" class="${t === tool ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="astage"><canvas></canvas></div>
      <div class="abar">
        ${COLORS.map(c => `<button class="clr ${c === color ? 'on' : ''}" data-c="${c}" style="background:${c}"></button>`).join('')}
        <span class="sep"></span>
        ${[1, 2, 3].map(v => `<button data-w="${v}" class="${v === lw ? 'on' : ''}">${['細', '中', '粗'][v - 1]}</button>`).join('')}
        <span class="sep"></span>
        <button data-a="undo">↶ 復原</button><button data-a="clear">清除</button>
        <button data-a="cancel">取消</button><button data-a="save" style="background:#1f8a4c;border-color:#1f8a4c">✓ 完成</button>
      </div></div>`;
    const cv = $('canvas', M); cv.width = w; cv.height = h; const x = cv.getContext('2d');
    const u = Math.max(w, h) / 400;
    const redraw = () => { x.drawImage(bmp, 0, 0, w, h); shapes.forEach(s => drawShape(x, s, u)); if (cur) drawShape(x, cur, u); };
    redraw();
    const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * w / r.width, (e.clientY - r.top) * h / r.height]; };
    cv.onpointerdown = e => {
      e.preventDefault(); const q = pt(e);
      if (tool === 'text') { const t = prompt('輸入標註文字'); if (t) { shapes.push({ t: 'text', c: color, w: lw, p: [q], text: t }); redraw(); } return; }
      cv.setPointerCapture(e.pointerId); cur = { t: tool, c: color, w: lw, p: [q, q] };
    };
    cv.onpointermove = e => { if (!cur) return; const q = pt(e); if (cur.t === 'free') cur.p.push(q); else cur.p[1] = q; redraw(); };
    cv.onpointerup = cv.onpointercancel = () => {
      if (!cur) return; const a = cur.p[0], b = cur.p[cur.p.length - 1];
      if (cur.t === 'free' ? cur.p.length > 2 : Math.hypot(b[0] - a[0], b[1] - a[1]) > u * 3) shapes.push(cur);
      cur = null; redraw();
    };
    M.onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.t) { tool = b.dataset.t; $$('[data-t]', M).forEach(z => z.classList.toggle('on', z === b)); }
      if (b.dataset.c) { color = b.dataset.c; $$('[data-c]', M).forEach(z => z.classList.toggle('on', z === b)); }
      if (b.dataset.w) { lw = +b.dataset.w; $$('[data-w]', M).forEach(z => z.classList.toggle('on', z === b)); }
      const a = b.dataset.a;
      if (a === 'undo') { shapes.pop(); redraw(); }
      if (a === 'clear' && shapes.length && confirm('清除所有標註？')) { shapes.length = 0; redraw(); }
      if (a === 'cancel') { M.onclick = null; await photoSheet(p); resolve(false); }
      if (a === 'save') {
        b.disabled = true; p.shapes = shapes; await renderPhoto(p); await DB.put('photos', p);
        addLog(`標註照片「${p.title || p.origName || ''}」`); await saveNow();
        M.onclick = null; await photoSheet(p); resolve(true);
      }
    };
  });
}

function signPad(title) {
  return new Promise(resolve => {
    const M = $('#modal'); M.classList.add('on');
    M.innerHTML = `<div class="sigpad">
      <div class="sighd"><b>${esc(title)}　請於框內簽名</b><span class="muted">手機可橫放以獲得較大簽名區</span></div>

      <div class="row" style="margin-top:8px"><button class="btn" id="sgC">取消</button><button class="btn" id="sgR">清除</button><button class="btn pri" id="sgO">確認簽名</button></div></div>`;
    const wrap = $('.sigwrap', M), cv = $('canvas', M), x = cv.getContext('2d');
    // 筆跡以「螢幕上的實際位置」記錄，每次依畫布當下大小換算，轉向或縮放都不會偏移
    const strokes = []; let cur = null;
    const ratio = () => cv.width / (cv.getBoundingClientRect().width || 1);
    const stroke = s => {
      x.beginPath();
      if (s.length === 1) { x.arc(s[0][0], s[0][1], 1.4, 0, 7); x.fill(); return; }
      s.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke();
    };
    const draw = () => {
      const k = ratio(); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height);
      x.setTransform(k, 0, 0, k, 0, 0); x.lineWidth = 2.8; x.lineCap = x.lineJoin = 'round'; x.strokeStyle = x.fillStyle = '#0a1a5c';
      strokes.forEach(stroke);

    const setup = () => {
      const r = cv.getBoundingClientRect(); if (!r.width || !r.height) return;
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); draw();
    };
    const ro = window.ResizeObserver ? new ResizeObserver(setup) : null;
    if (ro) ro.observe(wrap);
    const onRot = () => setTimeout(setup, 300);
    window.addEventListener('resize', onRot); window.addEventListener('orientationchange', onRot);
    setTimeout(setup, 30);
    const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); draw(); };
    cv.onpointermove = e => {
      if (!cur) return; e.preventDefault();

    };
    cv.onpointerup = cv.onpointercancel = () => { cur = null; };
    const end = v => {
      if (ro) ro.disconnect();
      window.removeEventListener('resize', onRot); window.removeEventListener('orientationchange', onRot);
      closeModal(); resolve(v);
    };
    $('#sgC').onclick = () => end(null);
    $('#sgR').onclick = () => { strokes.length = 0; draw(); };
    $('#sgO').onclick = () => { if (!strokes.length) return alert('尚未簽名'); draw(); end(trimCanvas(cv)); };

function trimCanvas(cv) {
  const x = cv.getContext('2d'), { width: w, height: h } = cv, d = x.getImageData(0, 0, w, h).data;

  for (let y = 0; y < h; y++) for (let z = 0; z < w; z++) if (d[(y * w + z) * 4 + 3]) { if (y < t) t = y; if (y > b) b = y; if (z < l) l = z; if (z > r) r = z; }
  const m = 10; t = Math.max(0, t - m); l = Math.max(0, l - m); r = Math.min(w, r + m); b = Math.min(h, b + m);
  const c = document.createElement('canvas'); c.width = r - l; c.height = b - t;
  c.getContext('2d').drawImage(cv, l, t, r - l, b - t, 0, 0, r - l, b - t);
  return c.toDataURL('image/png');
}

async function makePDF(blocks, name) {
  const M = $('#modal'); M.classList.add('on');
  M.innerHTML = `<div class="sheet" style="display:flex;align-items:center;justify-content:center"><div class="card" style="max-width:420px;width:100%;text-align:center"><h3 id="pdfMsg">準備中…</h3><div class="muted">請勿切換畫面</div></div></div>`;
  const msg = t => { $('#pdfMsg').textContent = t; };

  try {
    await loadLib('html2canvas.min.js'); await loadLib('jspdf.umd.min.js');
    // A4 @96dpi：794×1123px；上下 10mm、左右 12mm
    const PW = 794, PH = 1123, MT = 38, MX = 45, AV = PH - MT * 2;
    host.style.cssText = 'position:fixed;left:0;top:0;z-index:-1;pointer-events:none';
    document.body.appendChild(host);

    const newPage = () => {
      const pg = document.createElement('div'); pg.className = 'rpt';
      pg.style.cssText = `width:${PW}px;height:${PH}px;padding:${MT}px ${MX}px;box-sizing:border-box;overflow:hidden;background:#fff;max-width:none;margin:0`;
      cur = document.createElement('div'); cur.style.display = 'flow-root'; pg.appendChild(cur); host.appendChild(pg); pgs.push(pg);
    };
    const fits = () => cur.getBoundingClientRect().height <= AV;

      const el = document.createElement('div'); el.innerHTML = blk.h; cur.appendChild(el); await imgsReady(el);
      if (fits()) continue;

        if (cur.children.length > 1) { el.remove(); newPage(); cur.appendChild(el); }
        continue;
      }
      // 可拆的表格／條列：逐列放，滿頁就換頁（表頭重複）
      const items = [...box.children]; box.innerHTML = '';
      const tpl = el.cloneNode(true);
      const topOf = (piece, c) => { let n = c; while (n.parentNode !== piece) n = n.parentNode; return n; };
      let piece = el, pc = box, idx = 0;
      while (idx < items.length) {
        pc.appendChild(items[idx]);
        if (fits()) { idx++; continue; }
        items[idx].remove();
        if (!pc.children.length) {
          if (cur.children.length > 1) { piece.remove(); newPage(); cur.appendChild(piece); continue; }
          pc.appendChild(items[idx]); idx++; continue;   // 單列就超過一頁，只能硬放
        }

        newPage(); piece = tpl.cloneNode(true);

        if (pc.tagName === 'OL') pc.start = idx + 1;
        cur.appendChild(piece);
      }
      if (!fits()) {   // 表格下方的註解放不下就移到下一頁
        const t = topOf(piece, pc).nextSibling;
        if (t) { const rest = []; let n = t; while (n) { rest.push(n); n = n.nextSibling; } rest.forEach(x => x.remove()); newPage(); rest.forEach(x => cur.appendChild(x)); }
      }
    }

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    for (let n = 0; n < pgs.length; n++) {
      msg(`產生 PDF 第 ${n + 1} / ${pgs.length} 頁…`);
      const cv = await html2canvas(pgs[n], { scale: 2, backgroundColor: '#ffffff', logging: false, scrollX: 0, scrollY: 0, windowWidth: PW, windowHeight: PH });
      if (n) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      cv.width = cv.height = 0;
    }
    const blob = pdf.output('blob');
    fileReady(new File([blob], name + '.pdf', { type: 'application/pdf' }), 'PDF', `共 ${pgs.length} 頁`);
  } catch (e) {
    console.error(e); closeModal(); alert('PDF 產生失敗：' + e.message);
  } finally { host.remove(); }
}

// 解析工地填的日期：Excel 日期、2026/10/30、115/10/30、115.10.30、10/30
function parseXlDate(v, refDate) {
  if (v == null || v === '') return '';
  if (v instanceof Date) return v.getUTCFullYear() + '-' + pad(v.getUTCMonth() + 1) + '-' + pad(v.getUTCDate());
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  if (typeof v === 'object' && v.text) v = v.text;
  const t = String(v).trim();
  let m = t.match(/^(\d{2,4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/);
  if (m) { let y = +m[1]; if (y < 1911) y += 1911; return y + '-' + pad(+m[2]) + '-' + pad(+m[3]); }
  m = t.match(/^(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/);
  if (m) return refDate.slice(0, 4) + '-' + pad(+m[1]) + '-' + pad(+m[2]);
  return null;
}
const cellText = v => v == null ? '' : typeof v === 'object' ? (v.text || (v.richText ? v.richText.map(x => x.text).join('') : v.result ?? '')) : String(v);
function importTrackXLSX(i, done) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,' + XL_TYPE;
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    busy('讀取 Excel 中…');
    try {
      await loadLib('exceljs.min.js');
      const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
      let ws = null, head = 0;
      wb.eachSheet(sh => { if (ws) return; sh.eachRow((row, n) => { if (!head && cellText(row.getCell(1).value).trim() === '編號') { ws = sh; head = n; } }); });
      if (!ws) throw new Error('找不到列管表（請使用 App 匯出的列管表檔案）');
      const changes = [], skipped = [], warns = [];
      for (let n = head + 1; n <= ws.rowCount; n++) {
        const row = ws.getRow(n), id = cellText(row.getCell(1).value).trim();
        const title = cellText(row.getCell(4).value).trim();
        if (!id && !title) continue;
        const e = i.entries.find(x => x.itemId === id);
        if (!e) { skipped.push(title || `第 ${n} 列`); continue; }
        const ch = { e, set: {} };
        const np = parseXlDate(row.getCell(7).value, i.date);
        if (np === null) warns.push(`「${e.title}」新承諾日格式無法辨識，已略過`);
        else if (np && np !== e.promise) ch.set.promise = np;
        const stt = normStatus(cellText(row.getCell(8).value).trim());
        if (stt && !STATUS.includes(stt)) warns.push(`「${e.title}」狀態「${stt}」不在選項內，已略過`);
        else if (stt && stt !== e.status) ch.set.status = stt;
        const dd = parseXlDate(row.getCell(9).value, i.date);
        if (dd === null) warns.push(`「${e.title}」完成日期格式無法辨識，已略過`);
        const finalStatus = ch.set.status || e.status;
        if (finalStatus === '已完成') { const want = dd || e.doneDate || i.date; if (want !== e.doneDate) ch.set.doneDate = want; }
        else if (ch.set.status && e.doneDate) ch.set.doneDate = '';
        const note = cellText(row.getCell(10).value).trim();
        if (note && !(e.note || '').includes(note)) ch.set.note = (e.note ? e.note + '\n' : '') + '工地回覆：' + note;
        if (Object.keys(ch.set).length) changes.push(ch);
      }
      const lines = changes.map(({ e, set }) => `<div class="card" style="padding:10px;margin-bottom:8px"><b>${esc(e.title)}</b><div class="muted">` + [
        set.promise ? `承諾日：${roc(e.promise) || '（無）'} → <b style="color:var(--red)">${roc(set.promise)}</b>${e.promise && set.promise > e.promise ? '（延期）' : ''}` : '',
        set.status ? `狀態：${esc(e.status)} → <b>${esc(set.status)}</b>` : '',
        set.doneDate ? `完成日期：${roc(set.doneDate)}` : '',
        set.note ? `說明：${esc(set.note.split('\n').pop())}` : '',
      ].filter(Boolean).join('<br>') + '</div></div>').join('');
      const M = $('#modal'); M.classList.add('on');
      M.innerHTML = `<div class="sheet"><div class="inner"><h3>工地更新內容確認</h3>
        <div class="muted" style="margin-bottom:8px">檔案：${esc(f.name)}｜可更新 ${changes.length} 項${skipped.length ? `｜略過 ${skipped.length} 列（非本次列管項目，不會新增）` : ''}</div>
        ${warns.length ? `<div class="warn">${warns.map(esc).join('<br>')}</div>` : ''}
        ${lines || '<div class="card muted">沒有任何變更</div>'}
        ${skipped.length ? `<div class="muted" style="margin:8px 4px">略過：${skipped.map(esc).join('、')}</div>` : ''}
        <div class="row" style="margin-top:12px"><button class="btn big" id="impC">取消</button>${changes.length ? `<button class="btn big pri" id="impO">套用 ${changes.length} 項更新</button>` : ''}</div></div></div>`;
      $('#impC').onclick = closeModal;
      if (changes.length) $('#impO').onclick = async () => {
        for (const { e, set } of changes) { Object.assign(e, set, { _editedAt: Date.now() }); if (set.status) e._lastStatus = set.status; }
        addLog(`匯入工地 Excel 更新 ${changes.length} 項（${f.name}）`);
        await saveNow(); closeModal(); toast(`已更新 ${changes.length} 項`); done();
      };
    } catch (e) { console.error(e); closeModal(); alert('匯入失敗：' + e.message); }
  };
  inp.click();
}

/* ========== 雲端同步 ========== */
const SYNC_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbxtU7sDyLU1341q_dtxjs2os0UOtlZBxrUVQzQ7zCqwj-lX8-bbgxATX2DYm4ui1bAk0A/exec';
const b64Of = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(String(f.result).split(',')[1]); f.readAsDataURL(b); });
const b64Blob = (b64, type) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return new Blob([u], { type: type || 'image/jpeg' }); };
async function saveDev() { await DB.putRaw('kv', Sync.dev); }
const Sync = {

  url() { return (S.settings && S.settings.syncUrl) || SYNC_URL_DEFAULT; },
  enabled() { return !!(this.url() && this.dev.code); },
  label() {
    if (!this.enabled()) return '只存本機';
    if (!navigator.onLine) return this.pending ? `離線（待上傳 ${this.pending}）` : '離線';
    if (this.busy) return '同步中…';
    if (this.err) return '同步失敗：' + this.err;
    return this.pending ? `待上傳 ${this.pending}` : '已同步 ✓';
  },
  show() {
    const n = $('#net'); n.textContent = this.enabled() ? this.label().replace(/：.*/, '') : (navigator.onLine ? '在線' : '離線');
    n.classList.toggle('off', !navigator.onLine || !!this.err);
    const st = $('#syncSt'); if (st) st.textContent = this.label();
  },
  soon(ms = 2500) { if (!this.enabled()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  async call(body, ms = 90000) {

      let j; try { j = await r.json(); } catch (e) { throw new Error('雲端沒有回應'); }
      if (j.error === 'auth') { this.dev.code = ''; await saveDev(); throw new Error('團隊通行碼已失效，請重新輸入'); }
      if (j.error) throw new Error(j.error);

  },
  async count() {

  if (!navigator.onLine || !Sync.enabled()) throw new Error('原始照片尚未下載到這台裝置，請在有網路時再操作');
  p.orig = await Sync.download(p.origFileId);
  const cur = await DB.get('photos', p.id); if (cur) { cur.orig = p.orig; await DB.putRaw('photos', cur); }
}
async function ensureAnnots(photos) {
  const miss = photos.filter(p => !p.annot && !p.orig);
  if (!miss.length) return true;
  if (!navigator.onLine || !Sync.enabled()) { alert(`有 ${miss.length} 張照片尚未下載到這台裝置，請在有網路時再產生報表。`); return false; }
  busy(`下載照片中（${miss.length} 張）…`);
  try {
    for (const p of miss) {
      if (p.annotFileId) p.annot = await Sync.download(p.annotFileId); else await ensureOrig(p);
      p.ver = (p.ver || 0) + 1;
      const cur = await DB.get('photos', p.id); if (cur) { cur.annot = p.annot || cur.annot; cur.orig = p.orig || cur.orig; cur.ver = p.ver; await DB.putRaw('photos', cur); }
    }
    closeModal(); return true;
  } catch (e) { closeModal(); alert('照片下載失敗：' + e.message); return false; }
}
// 雲端有更新時重新整理畫面（正在輸入或開著視窗時先不打擾）
function refreshAfterSync() {
  const a = document.activeElement;
  if (saveTimer || $('#modal').classList.contains('on') || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) { Sync.again = true; return; }
  if (S.cur && !isDirty(S.cur)) S.cur = null;
  const y = window.scrollY; route().then(() => window.scrollTo(0, y));
}
// 第一次使用：輸入姓名與團隊通行碼
function askIdentity(change) {
  if (!Sync.url()) return;
  const M = $('#modal'); M.classList.add('on');
  M.innerHTML = `<div class="sheet" style="display:flex;align-items:flex-start;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 50px)"><div class="card" style="max-width:400px;width:100%">
    <h3>☁️ 連線雲端資料</h3><div class="muted">輸入姓名與管理員提供的團隊通行碼。之後這台裝置會記住，資料有網路時自動同步。</div>
    <label class="f">你的姓名（會記在操作紀錄）</label><input id="idName" value="${esc(Sync.dev.name || '')}" placeholder="例：王小明">
    <label class="f">團隊通行碼</label><input id="idCode" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="6 位數">
    <div id="idMsg" style="color:var(--red);min-height:22px;font-size:14px;margin-top:6px"></div>
    <button class="btn big pri" id="idOk">連線</button>
    <button class="btn big" id="idSkip" style="margin-top:8px">${change ? '取消' : '暫不連線（只存本機）'}</button></div></div>`;
  $('#idOk').onclick = async () => {
    const name = $('#idName').value.trim(), code = $('#idCode').value.trim();
    if (!name) return $('#idMsg').textContent = '請輸入姓名';
    if (!code) return $('#idMsg').textContent = '請輸入團隊通行碼';
    if (!navigator.onLine) return $('#idMsg').textContent = '目前離線，請在有網路時連線';
    $('#idOk').disabled = true; $('#idMsg').textContent = '連線中…';
    const old = { ...Sync.dev };
    Object.assign(Sync.dev, { name, code, skip: false, deviceId: Sync.dev.deviceId || ('D' + uid().slice(-6).toUpperCase()) });
    try { await Sync.call({ action: 'ping' }); }
    catch (e) { Object.assign(Sync.dev, { code: old.code || '' }); $('#idOk').disabled = false; return $('#idMsg').textContent = /通行碼/.test(e.message) ? '團隊通行碼錯誤' : '連線失敗：' + e.message; }
    await saveDev(); closeModal(); toast('已連線雲端，開始同步'); Sync.run(true); route();
  };
  $('#idSkip').onclick = async () => { if (!change) { Sync.dev.skip = true; await saveDev(); } closeModal(); };
}

async function migrateStatus() {
  for (const it of await DB.all('items')) if (it.status === '施工中') { it.status = '進行中'; await DB.put('items', it); }
  for (const i of await DB.all('insp')) {
    if (i.locked || !i.entries.some(e => e.status === '施工中')) continue;
    i.entries.forEach(e => { if (e.status === '施工中') e.status = '進行中'; });
    await DB.put('insp', i);
    if (S.cur && S.cur.id === i.id) S.cur = null;
  }
}

/* ========== 版本更新 ========== */
const APP_VER = '2.3';
async function checkUpdate() {
  const msg = t => { const m = $('#updMsg'); if (m) m.textContent = t; };
  if (!navigator.onLine) return msg('目前離線，請在有網路的地方再按一次');
  msg('檢查中…');
  try {
    const t = await (await fetch('index.html?nc=' + Date.now(), { cache: 'no-store' })).text();
    const v = (t.match(/const APP_VER = '([\d.]+)'/) || [])[1];
    if (!v) return msg('無法讀取線上版本，請稍後再試');
    if (v === APP_VER) return msg(`已是最新版本（${v}）`);
    msg(`發現新版本 ${v}，更新中…`);
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
    setTimeout(() => location.reload(), 1500);
  } catch (e) { msg('檢查失敗：' + e.message); }
}

/* ========== 啟動 ========== */
async function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/');
  try {
    if (p[0] === 'insp' && p[1]) return await viewInsp(p[1], p[2] || 'basic');
    if (saveTimer) await saveNow();
    if (p[0] === 'items') return await viewItems();
    if (p[0] === 'settings') return await viewSettings();
    return await viewHome();
  } catch (e) { console.error(e); $('#app').innerHTML = `<div class="warn">發生錯誤：${esc(e.message)}</div>`; }
}
function netState() { Sync.show(); if (navigator.onLine) Sync.soon(500); }
(async () => {
  await DB.open();
  S.settings = Object.assign({}, DEFAULT_SETTINGS, await DB.get('kv', 'settings'));
  await DB.put('kv', S.settings);
  Sync.dev = (await DB.get('kv', 'device')) || { key: 'device' };
  await migrateStatus();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { }
  window.addEventListener('hashchange', route);
  window.addEventListener('online', netState); window.addEventListener('offline', netState); netState();
  document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveNow(); });
  window.addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
  await route();
  if (Sync.url() && !Sync.dev.code && !Sync.dev.skip) askIdentity(false);
  if (Sync.enabled()) Sync.run();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Sync.soon(300); });
  setInterval(() => { if (!document.hidden) Sync.run(); }, 60000);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    // 新版 Service Worker 接手時自動重新載入一次（正在填寫時不打斷）
    const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadCtrl || reloaded) return;
      if (saveTimer || $('#modal').classList.contains('on')) { toast('已下載新版本，下次開啟時套用'); return; }
      reloaded = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => { });
  }
})();
</script>
